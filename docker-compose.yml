# Escenario 4 (Disponibilidad): este servicio corre con 2 réplicas + su
# propio balanceador Nginx — autosuficiente, sin depender de planazo-infra
# para escalar. Requiere que `planazo-infra` ya esté arriba (crea la red
# compartida `planazo-net` y `postgres-booking`/`redis`); este repo solo se
# conecta a ella, no la crea.
#
#   docker compose up --build -d     → 2 réplicas + lb, igual que siempre en :3001
#
# Ver ../planazo-infra/ESCENARIO-04-DISPONIBILIDAD.md para el detalle del
# escenario de calidad y cómo demostrarlo. Nota: al partir el compose en dos
# (este y el de planazo-infra), `depends_on` ya no puede cruzar de uno a
# otro — si levantas este repo sin que postgres-booking/redis ya estén
# arriba, las réplicas reintentan la conexión (no se bloquean entre sí, como
# corresponde a servicios realmente autónomos).

networks:
  default:
    name: planazo-net
    external: true

x-app-common: &app-common
  build:
    context: .
  restart: unless-stopped
  env_file: ../planazo-infra/.env
  environment:
    PORT: "3001"
    DATABASE_URL: postgresql://booking:${PG_PASSWORD:?Falta PG_PASSWORD, usa docker compose --env-file ../planazo-infra/.env}@postgres-booking:5432/booking
    BUS_URL: redis://redis:6379
    # GATEWAY_KEY viene de env_file.
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 15s

services:
  booking-1:
    <<: *app-common
    container_name: planazo-booking-1

  booking-2:
    <<: *app-common
    container_name: planazo-booking-2

  lb:
    image: nginx:1.27-alpine
    container_name: planazo-booking-lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3001:3001"
    networks:
      default:
        # api-gateway le sigue hablando a http://booking:3001 sin cambiar
        # ninguna variable de entorno: el alias ahora resuelve al balanceador.
        aliases: [booking]
    depends_on:
      booking-1:
        condition: service_healthy
      booking-2:
        condition: service_healthy
